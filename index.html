<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexSite Digital | Em Manutenção</title>
    
    <meta name="description" content="Estamos atualizando nosso site para trazer novidades incríveis. Em breve retornaremos!">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00f2fe;
            --accent: #ab27ff;
            --darker: #020408;
            --glass: rgba(10, 15, 28, 0.85);
            --border: rgba(0, 242, 254, 0.3);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --gradient-primary: linear-gradient(135deg, var(--primary), var(--accent));
            --shadow-glow: 0 0 40px rgba(0, 242, 254, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--darker);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* Efeitos de fundo */
        .bg-grid {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 242, 254, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -2;
            pointer-events: none;
        }

        .bg-gradient {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(0, 242, 254, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(171, 39, 255, 0.15) 0%, transparent 50%);
            z-index: -1;
            pointer-events: none;
        }

        /* Caixa de Manutenção */
        .maintenance-card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 50px 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(15px);
            box-shadow: var(--shadow-glow);
            animation: fadeInUp 0.8s ease;
        }

        .maintenance-icon {
            width: 80px;
            height: 80px;
            background: var(--gradient-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            color: white;
            margin: 0 auto 30px;
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.4);
            animation: pulse 2s infinite;
        }

        .maintenance-badge {
            display: inline-block;
            padding: 6px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 50px;
            font-size: 0.8rem;
            color: var(--primary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(2rem, 4vw, 2.8rem);
            font-weight: 800;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        h1 span {
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 35px;
        }

        /* Botão de contato rápido */
        .btn-whatsapp {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 35px;
            background: #25d366;
            color: white;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
        }

        .btn-whatsapp:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.6);
        }

        .footer-note {
            margin-top: 30px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            opacity: 0.7;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @media (max-width: 480px) {
            .maintenance-card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="bg-gradient"></div>

    <div class="maintenance-card">
        <div class="maintenance-icon">
            <i class="fas fa-tools"></i>
        </div>
        
        <div class="maintenance-badge">Site em Atualização</div>
        
        <h1>Estamos Melhorando a sua <span>Experiência</span></h1>
        
        <p>
            Estamos realizando melhorias e atualizações em nossa plataforma para trazer novidades e um desempenho ainda melhor. Retornaremos em breve!
        </p>

        <a href="https://wa.me/558398015278?text=Olá!%20Vi%20que%20o%20site%20está%20em%20manutenção%20e%20gostaria%20de%20falar%20sobre%20um%20projeto." target="_blank" class="btn-whatsapp">
            <i class="fab fa-whatsapp" style="font-size: 1.3rem;"></i> Falar no WhatsApp
        </a>

        <div class="footer-note">
            NexSite Digital © 2026 — Patos, PB
        </div>
    </div>

</body>
</html>
